name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@12.1.0

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [ "$tag_version" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Check types and tests
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public --provenance --registry https://registry.npmjs.org
